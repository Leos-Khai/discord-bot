[project]
name = "discord-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "davey>=0.1.4",
    "discord-py>=2.6.4",
    "dotenv>=0.9.9",
    "edge-tts>=7.2.8",
    "motor>=3.7.1",
    "pynacl>=1.6.2",
    "yt-dlp>=2026.1.29",
]

[project.scripts]
bot = "main:run"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
